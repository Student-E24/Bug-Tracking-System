<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BugTracker – Projects</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app-nav"></div>

  <div class="page-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0 fw-bold">Projects</h5>
      <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ New Project</button>
    </div>

    <div class="row g-3" id="projects-grid"></div>
  </div>

  <!-- Add / Edit modal -->
  <div class="modal fade" id="project-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title" id="project-modal-title">New Project</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="project-form">
          <div class="modal-body">
            <input type="hidden" id="f-project-id" />
            <div class="mb-3">
              <label class="form-label">Name <span class="text-danger">*</span></label>
              <input type="text" id="f-project-name" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea id="f-project-description" class="form-control" rows="2"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Color</label>
              <div class="d-flex flex-wrap gap-2" id="color-palette"></div>
              <input type="hidden" id="f-project-color" value="#4361ee" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Delete confirm -->
  <div class="modal fade" id="delete-project-modal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title">Delete Project?</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body small">Existing issues will not be deleted.</div>
        <div class="modal-footer">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-danger btn-sm" id="confirm-delete-project">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/issues.js"></script>
  <script src="js/people.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
  <script>
    App.init();
    Seed.run();

    let pendingDeleteId  = null;
    let selectedColor    = '#4361ee';

    /* ── Build colour palette ────────────────────────────────── */
    function buildPalette() {
      const container = document.getElementById('color-palette');
      Projects.PALETTE.forEach(color => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.style.cssText = `width:28px;height:28px;border-radius:50%;background:${color};border:3px solid transparent;cursor:pointer;`;
        btn.title = color;
        btn.addEventListener('click', () => selectColor(color));
        btn.dataset.color = color;
        container.appendChild(btn);
      });
      selectColor(selectedColor);
    }

    function selectColor(color) {
      selectedColor = color;
      document.getElementById('f-project-color').value = color;
      document.querySelectorAll('#color-palette button').forEach(btn => {
        btn.style.borderColor = btn.dataset.color === color ? '#333' : 'transparent';
      });
    }

    /* ── Render grid ─────────────────────────────────────────── */
    function render() {
      const grid     = document.getElementById('projects-grid');
      const projects = Projects.getAll();

      if (projects.length === 0) {
        grid.innerHTML = `<div class="col-12">
          <div class="empty-state"><div class="empty-icon">📁</div><p>No projects yet. Create one!</p></div>
        </div>`;
        return;
      }

      grid.innerHTML = projects.map(project => {
        const issueCount = Storage.query('issues', i => i.projectId === project.id).length;
        const doneCount  = Storage.query('issues', i => i.projectId === project.id && i.status === 'done').length;
        const pct        = issueCount > 0 ? Math.round((doneCount / issueCount) * 100) : 0;
        return `
          <div class="col-12 col-sm-6 col-lg-4">
            <div class="card h-100">
              <div class="card-body">
                <div class="d-flex align-items-center mb-2">
                  <span class="project-dot" style="background:${project.color};width:14px;height:14px;"></span>
                  <h6 class="mb-0 ms-1 fw-semibold">${project.name}</h6>
                </div>
                <p class="text-muted small mb-3">${project.description || '—'}</p>
                <div class="d-flex justify-content-between small text-muted mb-1">
                  <span>${issueCount} issue${issueCount !== 1 ? 's' : ''}</span>
                  <span>${pct}% done</span>
                </div>
                <div class="progress" style="height:6px">
                  <div class="progress-bar" style="width:${pct}%;background:${project.color}"></div>
                </div>
              </div>
              <div class="card-footer d-flex justify-content-end gap-2 py-2">
                <button class="btn btn-outline-primary btn-sm"
                        onclick="openEditModal('${project.id}')">Edit</button>
                <button class="btn btn-outline-danger btn-sm"
                        onclick="askDelete('${project.id}')">Delete</button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    /* ── Modal helpers ───────────────────────────────────────── */
    function openAddModal() {
      document.getElementById('project-modal-title').textContent = 'New Project';
      document.getElementById('project-form').reset();
      document.getElementById('f-project-id').value = '';
      selectColor(Projects.randomColor());
      new bootstrap.Modal(document.getElementById('project-modal')).show();
    }

    function openEditModal(id) {
      const project = Projects.get(id);
      if (!project) return;
      document.getElementById('project-modal-title').textContent = 'Edit Project';
      document.getElementById('f-project-id').value          = project.id;
      document.getElementById('f-project-name').value        = project.name        || '';
      document.getElementById('f-project-description').value = project.description || '';
      selectColor(project.color || '#4361ee');
      new bootstrap.Modal(document.getElementById('project-modal')).show();
    }

    function askDelete(id) {
      pendingDeleteId = id;
      new bootstrap.Modal(document.getElementById('delete-project-modal')).show();
    }

    /* ── Save form ───────────────────────────────────────────── */
    document.getElementById('project-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const id          = document.getElementById('f-project-id').value;
      const name        = document.getElementById('f-project-name').value.trim();
      const description = document.getElementById('f-project-description').value.trim();
      const color       = document.getElementById('f-project-color').value;
      const data        = { name, description, color };

      if (id) {
        Projects.update(id, data);
        App.toast('Project updated!');
      } else {
        Projects.create(data);
        App.toast('Project created!', 'success');
      }
      bootstrap.Modal.getInstance(document.getElementById('project-modal')).hide();
      render();
    });

    /* ── Delete ──────────────────────────────────────────────── */
    document.getElementById('confirm-delete-project').addEventListener('click', () => {
      if (pendingDeleteId) {
        Projects.remove(pendingDeleteId);
        pendingDeleteId = null;
        bootstrap.Modal.getInstance(document.getElementById('delete-project-modal')).hide();
        render();
        App.toast('Project deleted', 'warning');
      }
    });

    buildPalette();
    render();
  </script>
</body>
</html>
