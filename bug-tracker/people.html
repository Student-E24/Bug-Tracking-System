<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BugTracker – People</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app-nav"></div>

  <div class="page-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0 fw-bold">People</h5>
      <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Add Person</button>
    </div>

    <div class="row g-3" id="people-grid"></div>
  </div>

  <!-- Add / Edit modal -->
  <div class="modal fade" id="person-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title" id="person-modal-title">Add Person</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="person-form">
          <div class="modal-body">
            <input type="hidden" id="f-person-id" />
            <div class="mb-3">
              <label class="form-label">Name <span class="text-danger">*</span></label>
              <input type="text" id="f-person-name" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Email <span class="text-danger">*</span></label>
              <input type="email" id="f-person-email" class="form-control" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Role</label>
              <select id="f-person-role" class="form-select">
                <option value="">— Select Role —</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Delete confirm -->
  <div class="modal fade" id="delete-person-modal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title">Remove Person?</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body small">This cannot be undone.</div>
        <div class="modal-footer">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-danger btn-sm" id="confirm-delete-person">Remove</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/issues.js"></script>
  <script src="js/people.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
  <script>
    App.init();
    Seed.run();

    let pendingDeleteId = null;

    /* ── Populate role select ────────────────────────────────── */
    function populateRoles() {
      const sel = document.getElementById('f-person-role');
      People.ROLES.forEach(r => {
        sel.insertAdjacentHTML('beforeend', `<option value="${r.id}">${r.label}</option>`);
      });
    }

    /* ── Render grid ─────────────────────────────────────────── */
    function render() {
      const grid = document.getElementById('people-grid');
      const people = People.getAll();

      if (people.length === 0) {
        grid.innerHTML = `<div class="col-12">
          <div class="empty-state"><div class="empty-icon">👥</div><p>No people yet. Add someone!</p></div>
        </div>`;
        return;
      }

      grid.innerHTML = people.map(person => {
        const issueCount = Storage.query('issues', i => i.assigneeId === person.id).length;
        const roleMeta = People.roleMeta(person.role);
        return `
          <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <div class="card h-100 text-center p-3">
              <div class="mb-2">${People.avatarHtml(person).replace('avatar-circle', 'avatar-circle lg')}</div>
              <div class="fw-semibold">${person.name}</div>
              <div class="text-muted small mb-1">${person.email}</div>
              <div class="mb-2">
                <span class="badge bg-secondary">${roleMeta.label || '—'}</span>
              </div>
              <div class="text-muted small mb-3">${issueCount} issue${issueCount !== 1 ? 's' : ''}</div>
              <div class="d-flex justify-content-center gap-2">
                <button class="btn btn-outline-primary btn-sm"
                        onclick="openEditModal('${person.id}')">Edit</button>
                <button class="btn btn-outline-danger btn-sm"
                        onclick="askDelete('${person.id}')">Remove</button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    /* ── Modal helpers ───────────────────────────────────────── */
    function openAddModal() {
      document.getElementById('person-modal-title').textContent = 'Add Person';
      document.getElementById('person-form').reset();
      document.getElementById('f-person-id').value = '';
      new bootstrap.Modal(document.getElementById('person-modal')).show();
    }

    function openEditModal(id) {
      const person = People.get(id);
      if (!person) return;
      document.getElementById('person-modal-title').textContent = 'Edit Person';
      document.getElementById('f-person-id').value    = person.id;
      document.getElementById('f-person-name').value  = person.name  || '';
      document.getElementById('f-person-email').value = person.email || '';
      document.getElementById('f-person-role').value  = person.role  || '';
      new bootstrap.Modal(document.getElementById('person-modal')).show();
    }

    function askDelete(id) {
      pendingDeleteId = id;
      new bootstrap.Modal(document.getElementById('delete-person-modal')).show();
    }

    /* ── Save form ───────────────────────────────────────────── */
    document.getElementById('person-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const id    = document.getElementById('f-person-id').value;
      const name  = document.getElementById('f-person-name').value.trim();
      const email = document.getElementById('f-person-email').value.trim();
      const role  = document.getElementById('f-person-role').value;
      const data  = { name, email, role, avatar: People.initials(name) };

      if (id) {
        People.update(id, data);
        App.toast('Person updated!');
      } else {
        People.create(data);
        App.toast('Person added!', 'success');
      }
      bootstrap.Modal.getInstance(document.getElementById('person-modal')).hide();
      render();
    });

    /* ── Delete ──────────────────────────────────────────────── */
    document.getElementById('confirm-delete-person').addEventListener('click', () => {
      if (pendingDeleteId) {
        People.remove(pendingDeleteId);
        pendingDeleteId = null;
        bootstrap.Modal.getInstance(document.getElementById('delete-person-modal')).hide();
        render();
        App.toast('Person removed', 'warning');
      }
    });

    populateRoles();
    render();
  </script>
</body>
</html>
