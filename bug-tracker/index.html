<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BugTracker – Login</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card p-4">
      <div class="card-body">
        <span class="login-logo">🐛</span>
        <h4 class="text-center fw-bold mb-1">BugTracker</h4>
        <p class="text-center text-muted small mb-4">Sign in to your workspace</p>

        <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

        <form id="login-form">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" class="form-control" placeholder="admin"
                   autocomplete="username" required />
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••"
                   autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>

        <p class="text-center text-muted mt-3 small">
          Demo credentials: <strong>admin</strong> / <strong>admin123</strong>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) {
      window.location.href = 'dashboard';
    }

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('login-error');

      if (Auth.login(username, password)) {
        window.location.href = 'dashboard';
      } else {
        errEl.textContent = 'Invalid username or password. Try admin / admin123.';
        errEl.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
