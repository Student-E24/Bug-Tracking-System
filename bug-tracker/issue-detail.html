<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BugTracker – Issue Detail</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app-nav"></div>

  <div class="page-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <a href="issues" class="btn btn-outline-secondary btn-sm">← Back to Issues</a>
      <div id="detail-actions" class="d-flex gap-2"></div>
    </div>

    <div class="row g-4">
      <!-- Main form -->
      <div class="col-12 col-lg-8">
        <div class="card">
          <div class="card-body">
            <form id="issue-form">
              <div class="mb-3">
                <label class="form-label">Title <span class="text-danger">*</span></label>
                <input type="text" id="f-title" class="form-control" placeholder="Brief description of the issue" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea id="f-description" class="form-control" rows="5"
                          placeholder="Detailed description, steps to reproduce, expected vs actual behaviour…"></textarea>
              </div>
              <div class="row g-3">
                <div class="col-6 col-md-3">
                  <label class="form-label">Status</label>
                  <select id="f-status" class="form-select"></select>
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label">Priority</label>
                  <select id="f-priority" class="form-select"></select>
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label">Type</label>
                  <select id="f-type" class="form-select"></select>
                </div>
                <div class="col-6 col-md-3">
                  <label class="form-label">Project</label>
                  <select id="f-project" class="form-select">
                    <option value="">— None —</option>
                  </select>
                </div>
              </div>
              <div class="row g-3 mt-1">
                <div class="col-12 col-md-6">
                  <label class="form-label">Assignee</label>
                  <select id="f-assignee" class="form-select">
                    <option value="">— Unassigned —</option>
                  </select>
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label">Tags <span class="text-muted small">(comma-separated)</span></label>
                  <input type="text" id="f-tags" class="form-control" placeholder="frontend, auth, safari" />
                </div>
              </div>
              <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary" id="save-btn">Save Issue</button>
                <a href="issues" class="btn btn-outline-secondary">Cancel</a>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Sidebar meta -->
      <div class="col-12 col-lg-4" id="sidebar-meta"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/issues.js"></script>
  <script src="js/people.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
  <script>
    App.init();
    Seed.run();

    const params = new URLSearchParams(window.location.search);
    const issueId  = params.get('id');
    const isNew    = params.has('new');
    let   current  = issueId ? Issues.get(issueId) : null;

    /* ── Populate selects ────────────────────────────────────── */
    function populateSelects() {
      const statusSel = document.getElementById('f-status');
      Issues.STATUSES.forEach(s => {
        statusSel.insertAdjacentHTML('beforeend', `<option value="${s.id}">${s.label}</option>`);
      });

      const prioritySel = document.getElementById('f-priority');
      Issues.PRIORITIES.forEach(p => {
        prioritySel.insertAdjacentHTML('beforeend', `<option value="${p.id}">${p.label}</option>`);
      });

      const typeSel = document.getElementById('f-type');
      Issues.TYPES.forEach(t => {
        typeSel.insertAdjacentHTML('beforeend', `<option value="${t.id}">${t.icon} ${t.label}</option>`);
      });

      const projectSel = document.getElementById('f-project');
      Projects.getAll().forEach(p => {
        projectSel.insertAdjacentHTML('beforeend', `<option value="${p.id}">${p.name}</option>`);
      });

      const assigneeSel = document.getElementById('f-assignee');
      People.getAll().forEach(p => {
        assigneeSel.insertAdjacentHTML('beforeend', `<option value="${p.id}">${p.name}</option>`);
      });
    }

    /* ── Fill form from existing issue ──────────────────────── */
    function fillForm(issue) {
      document.getElementById('f-title').value       = issue.title       || '';
      document.getElementById('f-description').value = issue.description || '';
      document.getElementById('f-status').value      = issue.status      || 'backlog';
      document.getElementById('f-priority').value    = issue.priority    || 'medium';
      document.getElementById('f-type').value        = issue.type        || 'bug';
      document.getElementById('f-project').value     = issue.projectId   || '';
      document.getElementById('f-assignee').value    = issue.assigneeId  || '';
      document.getElementById('f-tags').value        = (issue.tags || []).join(', ');
    }

    /* ── Sidebar meta (only for existing issues) ─────────────── */
    function renderSidebar(issue) {
      if (!issue) return;
      const person  = issue.assigneeId ? People.get(issue.assigneeId)  : null;
      const project = issue.projectId  ? Projects.get(issue.projectId) : null;

      document.getElementById('sidebar-meta').innerHTML = `
        <div class="card">
          <div class="card-header fw-semibold small">Details</div>
          <ul class="list-group list-group-flush small">
            <li class="list-group-item d-flex justify-content-between">
              <span class="text-muted">ID</span>
              <code class="text-truncate ms-2">${issue.id}</code>
            </li>
            <li class="list-group-item d-flex justify-content-between">
              <span class="text-muted">Created</span>
              <span>${App.formatDate(issue.createdAt)}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between">
              <span class="text-muted">Updated</span>
              <span>${App.formatDate(issue.updatedAt)}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <span class="text-muted">Assignee</span>
              <span>${person ? People.avatarHtml(person) + ' ' + person.name : '—'}</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <span class="text-muted">Project</span>
              <span>${project ? Projects.colorDot(project) + project.name : '—'}</span>
            </li>
          </ul>
        </div>`;
    }

    /* ── Delete button ───────────────────────────────────────── */
    function renderActions(issue) {
      if (!issue) return;
      document.getElementById('detail-actions').innerHTML = `
        <button class="btn btn-outline-danger btn-sm" id="del-btn">Delete Issue</button>`;
      document.getElementById('del-btn').addEventListener('click', () => {
        if (confirm('Delete this issue? This cannot be undone.')) {
          Issues.remove(issue.id);
          window.location.href = 'issues';
        }
      });
    }

    /* ── Handle submit ───────────────────────────────────────── */
    document.getElementById('issue-form').addEventListener('submit', function (e) {
      e.preventDefault();

      const tags = document.getElementById('f-tags').value
        .split(',').map(t => t.trim()).filter(Boolean);

      const data = {
        title:       document.getElementById('f-title').value.trim(),
        description: document.getElementById('f-description').value.trim(),
        status:      document.getElementById('f-status').value,
        priority:    document.getElementById('f-priority').value,
        type:        document.getElementById('f-type').value,
        projectId:   document.getElementById('f-project').value   || null,
        assigneeId:  document.getElementById('f-assignee').value  || null,
        tags,
      };

      if (current) {
        Issues.update(current.id, data);
        App.toast('Issue updated!');
        current = Issues.get(current.id);
        renderSidebar(current);
      } else {
        const created = Issues.create(data);
        App.toast('Issue created!', 'success');
        window.location.href = `issue-detail?id=${created.id}`;
      }
    });

    /* ── Init ────────────────────────────────────────────────── */
    document.title = isNew
      ? 'BugTracker – New Issue'
      : current
        ? `BugTracker – ${current.title}`
        : 'BugTracker – Issue Not Found';

    populateSelects();

    if (current) {
      fillForm(current);
      renderSidebar(current);
      renderActions(current);
    } else if (!isNew) {
      document.getElementById('issue-form').innerHTML =
        `<div class="empty-state"><div class="empty-icon">🔍</div><p>Issue not found.</p></div>`;
    }
  </script>
</body>
</html>
