<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BugTracker – Issues</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app-nav"></div>

  <div class="page-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0 fw-bold">All Issues</h5>
      <a href="issue-detail?new=1" class="btn btn-primary btn-sm">+ New Issue</a>
    </div>

    <!-- Filters -->
    <div class="card mb-3">
      <div class="card-body py-2">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-md-4">
            <input type="search" id="search-input" class="form-control form-control-sm"
                   placeholder="Search issues…" />
          </div>
          <div class="col-6 col-md-2">
            <select id="filter-status" class="form-select form-select-sm">
              <option value="">All Statuses</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <select id="filter-priority" class="form-select form-select-sm">
              <option value="">All Priorities</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <select id="filter-project" class="form-select form-select-sm">
              <option value="">All Projects</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <button class="btn btn-outline-secondary btn-sm w-100" id="clear-filters">Clear</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th style="width:40%">Title</th>
              <th>Status</th>
              <th>Priority</th>
              <th>Project</th>
              <th>Assignee</th>
              <th>Created</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="issues-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Delete confirm modal -->
  <div class="modal fade" id="delete-modal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title">Delete Issue?</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body small">This action cannot be undone.</div>
        <div class="modal-footer">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-danger btn-sm" id="confirm-delete">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/issues.js"></script>
  <script src="js/people.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
  <script>
    App.init();
    Seed.run();

    let pendingDeleteId = null;

    /* ── Populate filter dropdowns ───────────────────────────── */
    function populateFilters() {
      const statusSel = document.getElementById('filter-status');
      Issues.STATUSES.forEach(s => {
        statusSel.insertAdjacentHTML('beforeend', `<option value="${s.id}">${s.label}</option>`);
      });

      const prioritySel = document.getElementById('filter-priority');
      Issues.PRIORITIES.forEach(p => {
        prioritySel.insertAdjacentHTML('beforeend', `<option value="${p.id}">${p.label}</option>`);
      });

      const projectSel = document.getElementById('filter-project');
      Projects.getAll().forEach(p => {
        projectSel.insertAdjacentHTML('beforeend', `<option value="${p.id}">${p.name}</option>`);
      });
    }

    /* ── Render table ────────────────────────────────────────── */
    function render() {
      const search   = document.getElementById('search-input').value.toLowerCase();
      const status   = document.getElementById('filter-status').value;
      const priority = document.getElementById('filter-priority').value;
      const project  = document.getElementById('filter-project').value;

      let issues = Issues.getAll();

      if (search)   issues = issues.filter(i =>
        i.title.toLowerCase().includes(search) ||
        (i.description || '').toLowerCase().includes(search) ||
        (i.tags || []).some(t => t.toLowerCase().includes(search))
      );
      if (status)   issues = issues.filter(i => i.status   === status);
      if (priority) issues = issues.filter(i => i.priority === priority);
      if (project)  issues = issues.filter(i => i.projectId === project);

      const tbody = document.getElementById('issues-tbody');

      if (issues.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7">
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <div>No issues found</div>
          </div>
        </td></tr>`;
        return;
      }

      tbody.innerHTML = issues.map(issue => {
        const person  = issue.assigneeId ? People.get(issue.assigneeId) : null;
        const project = issue.projectId  ? Projects.get(issue.projectId)  : null;
        const sMeta   = Issues.statusMeta(issue.status);
        const pMeta   = Issues.priorityMeta(issue.priority);
        return `
          <tr onclick="window.location='issue-detail?id=${issue.id}'" style="cursor:pointer">
            <td>
              <div class="fw-semibold">${issue.title}</div>
              <div>${(issue.tags || []).map(t => `<span class="tag-chip">${t}</span>`).join('')}</div>
            </td>
            <td><span class="badge bg-${sMeta.color}">${sMeta.label}</span></td>
            <td>
              <span class="badge bg-${pMeta.color} text-${pMeta.color === 'warning' ? 'dark' : 'white'}">
                ${pMeta.icon} ${pMeta.label}
              </span>
            </td>
            <td>
              ${project
                ? Projects.colorDot(project) + project.name
                : '<span class="text-muted">—</span>'}
            </td>
            <td>
              ${person
                ? People.avatarHtml(person) + ' <small>' + person.name + '</small>'
                : '<span class="text-muted">—</span>'}
            </td>
            <td class="text-muted small">${App.formatDate(issue.createdAt)}</td>
            <td onclick="event.stopPropagation()">
              <a href="issue-detail?id=${issue.id}" class="btn btn-outline-primary btn-sm py-0">Edit</a>
              <button class="btn btn-outline-danger btn-sm py-0" onclick="askDelete('${issue.id}')">Del</button>
            </td>
          </tr>`;
      }).join('');
    }

    function askDelete(id) {
      pendingDeleteId = id;
      new bootstrap.Modal(document.getElementById('delete-modal')).show();
    }

    document.getElementById('confirm-delete').addEventListener('click', () => {
      if (pendingDeleteId) {
        Issues.remove(pendingDeleteId);
        pendingDeleteId = null;
        bootstrap.Modal.getInstance(document.getElementById('delete-modal')).hide();
        render();
        App.toast('Issue deleted', 'danger');
      }
    });

    document.getElementById('clear-filters').addEventListener('click', () => {
      document.getElementById('search-input').value = '';
      document.getElementById('filter-status').value = '';
      document.getElementById('filter-priority').value = '';
      document.getElementById('filter-project').value = '';
      render();
    });

    ['search-input', 'filter-status', 'filter-priority', 'filter-project'].forEach(id => {
      document.getElementById(id).addEventListener('input', render);
    });

    populateFilters();
    render();
  </script>
</body>
</html>
