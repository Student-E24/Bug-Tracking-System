<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bug Tracking System – Login</title>
  <link rel="stylesheet" href="vendor/css/bootstrap.min.css" />
  <link rel="stylesheet" href="vendor/css/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-lg login-card">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <i class="bi bi-bug-fill text-danger" style="font-size:3rem;"></i>
        <h2 class="fw-bold mt-2">Bug Tracker</h2>
        <p class="text-muted">Sign in to continue</p>
      </div>
      <div id="loginError" class="alert alert-danger d-none" role="alert">
        Invalid username or password.
      </div>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="username" placeholder="admin" required />
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="••••••••" required />
          </div>
        </div>
        <button type="submit" class="btn btn-danger w-100 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
      </form>
      <p class="text-center text-muted mt-4 small">Default credentials: admin / admin123</p>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    if (sessionStorage.getItem('bts_auth') === 'true') {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (username === 'admin' && password === 'admin123') {
        sessionStorage.setItem('bts_auth', 'true');
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('loginError').classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
